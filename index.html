<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lauren Bourque · Engineer & Entrepreneur</title>
  <meta name="description" content="Lauren Bourque, software engineer and entrepreneur. Scroll to watch the sculpture take shape.">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <header id="site-header"></header>

  <main>
    <canvas id="scene" aria-hidden="true"></canvas>
    <p class="sr-only">A pixel-art Italian Renaissance garden with a villa, cypresses and fountain pools. Lauren, in a blue top and jeans, stands beside a slab of stone and carves a statue of herself as you scroll.</p>

    <figure id="quote" class="zone-top-fixed">
      <blockquote>
        <p class="q-text" data-text="“Every block of stone has a statue inside it, and it is the task of the sculptor to discover it.”"></p>
        <span class="sr-only">Every block of stone has a statue inside it, and it is the task of the sculptor to discover it.</span>
      </blockquote>
      <figcaption>Michelangelo</figcaption>
    </figure>

    <button id="scroll-hint" class="btn" type="button">
      <span>Scroll to reveal</span>
      <svg class="icon bob" viewBox="0 0 7 5" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor"><rect x="0" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/></svg>
    </button>

    <section id="story" aria-label="My story"></section>

    <div id="dock" role="group" aria-label="Scene controls">
      <button id="time-toggle" class="btn btn-small" type="button" aria-label="Change the time of day" title="Change the time of day in the garden">
        <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Day</span>
      </button>
      <button id="music-toggle" class="btn btn-small" type="button" aria-label="Toggle background music" aria-pressed="false" title="Play “Discovering Meaning” by R Eugene">
        <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Music off</span>
      </button>
      <audio id="bg-music" src="assets/music/discovering-meaning.mp3" preload="none" loop></audio>
    </div>

    <div id="scroll-space" aria-hidden="true"></div>
  </main>

  <script src="js/content.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/common.js"></script>
  <script src="js/scene.js"></script>
</body>
</html>
